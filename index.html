<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Centrale 118 · Secours Suisse</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand"><span class="cross">✚</span> Centrale <b>Secours Suisse</b></div>
    <div id="hud" hidden>
      <span id="hud-canton"></span>
      <span id="hud-money"></span>
      <span id="hud-clock"></span>
      <span id="hud-weather"></span>
      <button id="hud-sound" title="Sonnerie des appels">🔔</button>
      <span class="speed" role="group" aria-label="Vitesse du jeu">
        <button data-speed="0" title="Pause (Espace)">⏸</button>
        <button data-speed="1" title="Temps réel (1)">1×</button>
        <button data-speed="3" title="Rapide (2)">3×</button>
        <button data-speed="10" title="Très rapide (3)">10×</button>
        <button data-speed="30" title="Accéléré (4)">30×</button>
        <button data-speed="60" title="Nuit express (5)">60×</button>
      </span>
    </div>
  </header>

  <main>
    <div id="map"></div>
    <aside id="panel"></aside>
  </main>

  <div id="toasts" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
